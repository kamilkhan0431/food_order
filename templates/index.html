<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBites - Food Ordering</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #ff4757; }
        .menu-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 220px; }
        .card h3 { margin: 10px 0; color: #333; }
        button { background: #ff4757; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff6b81; }
        #order-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 300px; text-align: left; }
        .modal-content input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1>🍔 QuickBites Online Canteen</h1>
    <p>Select your favorite item and order instantly!</p>

    <div class="menu-container">
        <div class="card">
            <h3>Crispy Samosa</h3>
            <p>₹20</p>
            <button onclick="openModal('Crispy Samosa')">Order Now</button>
        </div>
        <div class="card">
            <h3>Cheesy Pizza</h3>
            <p>₹199</p>
            <button onclick="openModal('Cheesy Pizza')">Order Now</button>
        </div>
        <div class="card">
            <h3>Cold Coffee</h3>
            <p>₹90</p>
            <button onclick="openModal('Cold Coffee')">Order Now</button>
        </div>
    </div>

    <div id="order-modal">
        <div class="modal-content">
            <h3 id="selected-item-title">Enter Details</h3>
            <label>Your Name:</label>
            <input type="text" id="cust-name" placeholder="e.g. Kamil Khan">
            <label>Delivery Address / Room No:</label>
            <input type="text" id="cust-address" placeholder="e.g. Hostel Room 402">
            <br><br>
            <button onclick="submitOrder()" style="width: 100%;">Confirm & Send Order</button>
            <button onclick="closeModal()" style="background: #ccc; color: black; width: 100%; margin-top: 5px;">Cancel</button>
        </div>
    </div>

    <script>
        let chosenFood = "";

        function openModal(foodName) {
            chosenFood = foodName;
            document.getElementById("selected-item-title").innerText = "Order: " + foodName;
            document.getElementById("order-modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("order-modal").style.display = "none";
        }

        async function submitOrder() {
            const name = document.getElementById("cust-name").value;
            const address = document.getElementById("cust-address").value;

            if(!name || !address) {
                alert("Please fill in both fields!");
                return;
            }

            const response = await fetch('/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ food: chosenFood, name: name, address: address })
            });

            const result = await response.json();
            alert("Success! Your order has been placed and an email notification has been dispatched.");
            closeModal();
        }
    </script>
</body>
</html>
